services:
  postgres:
    image: postgres:16-alpine
    container_name: csdl_postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-training_db}
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-admin_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      # Các script trong ./sql/ (01~06, 08) sẽ tự động chạy khi DB khởi tạo lần đầu
      # File 07_assignment_queries.sql nằm trong sql/queries/ -> chạy THỦ CÔNG khi cần demo
      - ./sql:/docker-entrypoint-initdb.d:ro
    networks:
      - csdl_net

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: csdl_pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@admin.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin_password}
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    depends_on:
      - postgres
    networks:
      - csdl_net

volumes:
  pg_data:

networks:
  csdl_net:
    driver: bridge
